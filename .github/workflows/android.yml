name: Android APK
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python prepare.py
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/portfolio_web.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase Android configuration
        env:
          CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$CONFIG" ]; then printf '%s' "$CONFIG" > android/app/google-services.json; fi
      - run: chmod +x android/gradlew && cd android && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: woogong-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
